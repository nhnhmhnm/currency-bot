spring:
  application:
    name: backend

  config:
    import: optional:application-secret.yml

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  bank:
    simulation-enabled: ${APP_BANK_SIMULATION_ENABLED:false}
